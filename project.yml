name: WindscribeTester
options:
  bundleIdPrefix: local.windscribe
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "6.0"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  CODE_SIGN_IDENTITY: "-"
  CODE_SIGNING_REQUIRED: "NO"
  CODE_SIGNING_ALLOWED: "YES"
targets:
  WindscribeTester:
    type: application
    platform: macOS
    sources: [WindscribeTester]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: local.windscribe.server-tester
      PRODUCT_NAME: Windscribe Tester
      MARKETING_VERSION: "2.0.0"
      CURRENT_PROJECT_VERSION: "2"
      GENERATE_INFOPLIST_FILE: "YES"
      COMBINE_HIDPI_IMAGES: "YES"
      ENABLE_HARDENED_RUNTIME: "YES"
      CODE_SIGN_ENTITLEMENTS: WindscribeTester/WindscribeTester.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      SWIFT_STRICT_CONCURRENCY: complete
      INFOPLIST_KEY_CFBundleDisplayName: Windscribe Tester
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
      INFOPLIST_KEY_NSHighResolutionCapable: "YES"
      INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
      INFOPLIST_KEY_NSHumanReadableCopyright: ""
      INFOPLIST_KEY_NSSupportsAutomaticTermination: "NO"
      INFOPLIST_KEY_NSSupportsSuddenTermination: "NO"
schemes:
  WindscribeTester:
    build:
      targets:
        WindscribeTester: all
